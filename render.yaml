# Render Blueprint for the Vibe-Trading backend (persistent FastAPI server).
# Deploy: push this repo to GitHub, then in Render use "Blueprint" and point
# it at this file, or create a new Web Service from the repo.
#
# Free tier notes:
#   - Free web services sleep after 15 min of inactivity and wake on request.
#   - The disk is ephemeral on free instances; use the Neon Postgres database
#     (DATABASE_URL) for any state that must survive restarts.
services:
  - type: web
    name: vibe-trading-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # Build-time env vars for the frontend login gate. These are inlined into
    # the Vite bundle at build time, so they must be set here (or in the
    # service's Build env vars) BEFORE the image is built. Set either
    # VITE_APP_PASSWORD (plain text) or VITE_APP_PASSWORD_HASH (SHA-256 hex).
    buildEnvVars:
      - key: VITE_APP_PASSWORD
        sync: false # set manually to your desired login password
      - key: VITE_APP_PASSWORD_HASH
        sync: false # optional: SHA-256 hex of the password (preferred)
    envVars:
      - key: DATABASE_URL
        sync: false # set manually to your Neon connection string
      - key: POSTGRES_URL
        sync: false
      - key: VIBE_TRADING_ENABLE_SCHEDULER
        value: "true"
      - key: VIBE_TRADING_CHANNELS_AUTO_START
        value: "false"
      - key: PORT
        value: "8899"
